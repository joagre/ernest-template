name: Rule
description: A rule of the way of working that the template's files lack, or hold wrong, found in a copy of the template or in Ernest's repository.
body:
  - type: input
    id: copy
    attributes:
      label: Where it was found
      description: The repository the rule was found in, a copy's or Ernest's, and its commit.
      placeholder: ernest-httpd f064e87
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: The file
      description: The file of the template's that the rule changes, as CLAUDE.md's *What is the user's* names them.
      placeholder: CLAUDE.md, The work
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: The sentence as it would read there.
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: What showed it
      description: What happened there that the rule answers.
    validations:
      required: true
